<body>

                <input type="text" id="mistake" placeholder="예: 약속 시간에 1시간 늦음, 보고서 제출 기한 넘김, 연락을 안 받음" required>

                <button class="btn-action" onclick="copyResult()">📋 핑계 복사하기</button>

    <div class="toast" id="toast">핑계가 클립보드에 복사되었습니다!</div>

    <script>
        let selectedTone = 'polite';
        let currentResultIndex = 0;

        function selectTone(tone, element) {
            selectedTone = tone;
            document.querySelectorAll('.tone-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        const templates = {
            polite: [
                (target, location, mistake) => `${target}님, 정말 죄송합니다.\n${location}(으)로 향하던 중 갑작스러운 불가피한 상황(갑작스런 통신 장애 및 교통 문제)이 발생하여 ${mistake}(을/를) 하게 되었습니다.\n\n미리 상세히 상황을 공유드리지 못해 거듭 죄송하며, 이후 동일한 일이 없도록 철저히 신경 쓰겠습니다. 너른 양해 부탁드립니다.`,
                (target, location, mistake) => `${target}님, 우선 진심으로 사과의 말씀 드립니다.\n오늘 ${location} 상황을 준비하던 중 예치 못한 긴급한 문제가 발생하여 ${mistake}(이/가) 발생하게 되었습니다.\n\n불편을 드려 너무나 죄송하며, 지적해 주신 부분 깊이 반성하고 조속히 수습하도록 하겠습니다.`
            ],
            witty: [
                (target, location, mistake) => `${target}님! 정말 억울한 사연이 있습니다...\n${location}(으)로 출발하려던 순간, 우주가 저를 방해하는 듯한 연쇄적인 불운(배터리 방전 + 갑작스러운 도로 통제)이 겹쳐 본의 아니게 ${mistake}(을/를) 범하고 말았습니다. 😭\n\n지구의 억울함은 제가 다 끌어안았으니 한 번만 너그럽게 봐주시면 평생 은혜로 생각하겠습니다!`,
                (target, location, mistake) => `${target}님, 이건 정말 저의 의도가 아니었습니다!\n${location}에서 세운 제 계획은 완벽했으나, 뜻밖의 악재가 터져 결국 ${mistake}(을/를) 하게 되었네요...\n\n제 인류애를 걸고 다음엔 200% 완벽한 모습 보여드리겠습니다. 이번 한 번만 살려주세요! 🙇‍♂️`
            ],
            dramatic: [
                (target, location, mistake) => `(긴급한 목소리로) ${target}님... 지금 겨우 연락을 드립니다.\n오늘 ${location}(으)로 가던 도중 도저히 제 힘으로 제어할 수 없는 일련의 사건들이 터지는 바람에 결국 ${mistake}(을/를) 상황이 벌어졌습니다.\n\n지금 그 어떤 말로도 제 마음을 다 표현할 수 없을 만큼 죄송하고 참담합니다. 조만간 직접 찾아뵙고 사정말씀 올리겠습니다.`,
                (target, location, mistake) => `${target}님, 마치 영화의 한 장면처럼 믿기 힘든 예외 상황이 ${location}에서 일어났습니다...\n그 결과로 본의 아니게 ${mistake}(을/를) 하게 되었고, 저 스스로도 너무나 당황스럽고 죄송한 마음뿐입니다.\n\n너그러운 마음으로 한 번만 품어주신다면 정말 감사하겠습니다.`
            ]
        };

        function generateExcuse(e) {
            e.preventDefault();

            const mistake = document.getElementById('mistake').value.trim();
            const target = document.getElementById('target').value.trim();
            const location = document.getElementById('location').value.trim();

            if (!mistake || !target || !location) return;

            currentResultIndex = Math.floor(Math.random() * templates[selectedTone].length);
            displayResult(target, location, mistake);
        }

        function displayResult(target, location, mistake) {
            const list = templates[selectedTone];
            const excuse = list[currentResultIndex % list.length](target, location, mistake);

            const toneLabels = {
                polite: '정중·진지형',
                witty: '유머·위트형',
                dramatic: '드라마틱형'
            };

            document.getElementById('selectedToneLabel').innerText = toneLabels[selectedTone];
            document.getElementById('resultText').innerText = excuse;
            
            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'block';
            resultBox.scrollIntoView({ behavior: 'smooth' });
        }

        function regenerate() {
            const mistake = document.getElementById('mistake').value.trim();
            const target = document.getElementById('target').value.trim();
            const location = document.getElementById('location').value.trim();

            if (!mistake || !target || !location) return;

            currentResultIndex++;
            displayResult(target, location, mistake);
        }

        function copyResult() {
            const text = document.getElementById('resultText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                showToast();
            }).catch(err => {
                alert('복사에 실패했습니다. 직접 드래그해서 복사해주세요.');
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
"""

with open("excuse_generator.html", "w", encoding="utf-8") as f:
    f.write(html_content)

print("HTML generated successfully as excuse_generator.html")
